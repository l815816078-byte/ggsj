<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FY 卡密管理系统 - 登录</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  /* 背景装饰光晕（跟随主题的强调色） */
  .bg-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .35; pointer-events: none; }
  .bg-glow.g1 { width: 480px; height: 480px; background: var(--primary); top: -160px; left: -140px; }
  .bg-glow.g2 { width: 420px; height: 420px; background: var(--accent); bottom: -160px; right: -120px; }
  html[data-theme="dark"] .bg-glow { opacity: .22; }

  .theme-top {
    position: fixed; top: 18px; right: 18px; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border: 1px solid var(--border2); background: var(--card);
    color: var(--text-muted); border-radius: 8px; cursor: pointer;
    font-size: 12.5px; transition: all .15s;
  }
  .theme-top:hover { color: var(--accent); border-color: var(--accent); }
  .theme-top svg { width: 15px; height: 15px; fill: currentColor; }

  .login-card {
    position: relative; z-index: 2;
    width: 400px; padding: 44px 40px 36px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    animation: cardIn .4s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .logo-icon {
    width: 46px; height: 46px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px var(--shadow);
  }
  .logo-icon svg { width: 25px; height: 25px; fill: #fff; }
  .title { text-align: center; color: var(--text-strong); font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin: 6px 0 30px; }

  .field { margin-bottom: 16px; }
  .input { height: 44px; font-size: 14px; }
  .login-btn {
    width: 100%; height: 44px; margin-top: 6px;
    background: var(--primary); border: none; border-radius: 8px; color: #fff;
    font-size: 15px; font-weight: 600; letter-spacing: 4px; cursor: pointer;
    box-shadow: var(--shadow); transition: all .2s;
  }
  .login-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .login-btn:active { transform: translateY(0); }
  .login-btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }
  .tips { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 22px; }
  .msg { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }
</style>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <button class="theme-top" id="themeBtn" onclick="toggleTheme()"></button>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <div class="title">FY 卡密管理系统</div>
    </div>
    <div class="subtitle">请登录后进入管理控制台</div>

    <div class="field">
      <input id="username" class="input" type="text" placeholder="用户名" autocomplete="username">
    </div>
    <div class="field">
      <input id="password" class="input" type="password" placeholder="密码" autocomplete="current-password">
    </div>

    <button id="loginBtn" class="login-btn">登  录</button>
    <div id="msg" class="msg"></div>
    <div class="tips">管理员与代理同一入口，登录后自动识别角色</div>
  </div>

<script>
(function () {
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var btn = document.getElementById('loginBtn');
  var msg = document.getElementById('msg');

  // ── 主题切换（与后台同一套逻辑、同一 key，自动同步） ──
  var ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M12.3 4.9c.4-.2.6-.7.3-1.1-.2-.4-.7-.5-1.1-.3C8.4 5.2 6.1 8.6 6.1 12.5c0 5 4 9 9 9 2.3 0 4.4-.8 6-2.2.3-.3.4-.7.2-1.1-.2-.4-.7-.5-1.1-.3-1 .6-2.1.9-3.3.9-3.9 0-7-3.1-7-7 0-2.5 1.3-4.8 3.4-5.8z"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39-.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39-.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('fy_theme', t);
    document.getElementById('themeBtn').innerHTML = (t === 'dark' ? ICON_SUN : ICON_MOON) + '<span>' + (t === 'dark' ? '切换浅色模式' : '切换暗色模式') + '</span>';
  }
  window.toggleTheme = function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  applyTheme(localStorage.getItem('fy_theme') || 'dark');

  function show(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'success' : 'error');
  }

  async function login() {
    var username = usernameEl.value.trim();
    var password = passwordEl.value;
    if (!username || !password) {
      show('请输入用户名和密码', false);
      return;
    }
    btn.disabled = true;
    btn.textContent = '登录中...';
    show('', true);
    try {
      var resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await resp.json();
      if (data.code !== 0) {
        show(data.msg || '登录失败', false);
        return;
      }
      show('登录成功', true);
      setTimeout(function () {
        location.href = data.role === 'admin' ? '/admin.html' : '/agent.html';
      }, 400);
    } catch (e) {
      show('网络错误，无法连接服务器', false);
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = '登  录';
    }
  }

  btn.addEventListener('click', login);
  passwordEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') login();
  });
  usernameEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') login();
  });
})();
</script>
</body>
</html>
